[package]
name = "simble"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Zero-Copy Virtual Bluetooth Host Stack & Device Simulation Engine in Rust"
authors = ["Bill Schilit <schilit@google.com>"]
repository = "https://github.com/schilit/simble"
readme = "README.md"
keywords = ["bluetooth", "ble", "gatt", "l2cap", "channel-sounding"]
categories = ["emulators", "network-programming", "embedded"]

# `cdylib` is what wasm-bindgen links the browser module from; `rlib` keeps
# the crate usable as a normal Rust library (examples, tests, downstream).
[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# Used by the in_process_scene example to parse HCI events zero-copy.
zerocopy = { version = "0.8", features = ["derive"] }
# simble depending on itself is not a mistake. Rust has no way to spell
# "public to this crate's own tests but not to the world": `pub` is global and
# `pub(crate)` stops at the crate boundary, and `tests/` and `examples/` are
# separate crates that link simble from outside. So the protocol-plumbing
# modules are `pub` only under the `testing` feature (see src/lib.rs), and this
# self-dev-dependency is what turns that feature on automatically -- Cargo
# unifies the features of a path dependency with the package's own lib target,
# so `cargo test`, `cargo bench` and `cargo build --examples` all get it while
# `cargo build` and a downstream `[dependencies] simble` do not. No test or
# example needed an import changed for this.
#
# It carries a `path` and no `version`, which is what makes it invisible to
# crates.io: `cargo package` strips path-only dev-dependencies from the
# published manifest, so a consumer never sees the cycle. Not assumed --
# checked by unpacking the .crate and reading the generated manifest, which
# lists only zerocopy under [dev-dependencies]. `cargo package` including its
# verification build still succeeds at 5.6 MiB / 1.4 MiB compressed.
simble = { path = ".", features = ["testing"] }

[dependencies]
# Optional: see the `lc3` feature. Its own tests assert against golden
# output the author captured, not ETSI/SIG reference vectors, so this is
# good enough to make a demo audible and not a conformance claim
# (docs/lc3-evaluation.md).
lc3-codec = { version = "0.2", optional = true }
p256 = { version = "0.13", features = ["ecdh"] }
# `serde` gives rhai::serde::{to_dynamic, from_dynamic}: the bridge between
# JSON coming from a UI and the Dynamic values scripts see.
rhai = { version = "1.25", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }

[features]
# LC3, the LE Audio codec. Off by default: it is ~7k lines of DSP used only
# so the browser demo pages can *play* what a scripted sink receives, and
# neither the core library nor the `simble mcp` binary needs it — SDUs are
# opaque bytes to the protocol layers. The pages build enables it; see
# .github/workflows/pages.yml.
lc3 = ["dep:lc3-codec"]

# Widens the crate's public API to include the protocol-plumbing modules
# (`packets`, `att`, `l2cap`, `gap`, `smp`, `crypto`, `df`, `audio`, `obex`),
# which are `pub(crate)` without it. It exists so `tests/` can reach into the
# wire format without that reach becoming a promise to everyone else, and the
# self-dev-dependency above turns it on for every test and example build.
#
# Nothing downstream should enable it: what it exposes has no stability
# promise, and `--all-features` enabling it is precisely why CI has a separate
# no-features build (.github/workflows/ci.yml). Enabling it changes no
# behaviour and compiles no extra code -- only visibility.
testing = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: wasm-bindgen-cli's version must match the crate's.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
    "console",
] }
# rhai -> ahash -> getrandom, which on wasm32-unknown-unknown needs the
# browser backend enabled here plus `--cfg getrandom_backend="wasm_js"` in
# RUSTFLAGS at build time (see .github/workflows/pages.yml and README).
getrandom = { version = "0.3", features = ["wasm_js"] }
# p256 (LE Secure Connections ECDH) pulls the older getrandom 0.2 through
# elliptic-curve/rand_core; on wasm that generation needs its "js" backend
# enabled explicitly, or the build fails with "targets are not supported by
# default". Named so both majors can coexist.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[[example]]
name = "heart_rate_monitor"
path = "examples/heart_rate_monitor.rs"

[[example]]
name = "ble_keyboard"
path = "examples/ble_keyboard.rs"

[[example]]
name = "channel_sounding"
path = "examples/channel_sounding.rs"

[[example]]
name = "in_process_scene"
path = "examples/in_process_scene.rs"

[lints.rust]
# `rootcanal_oracle` gates the oracle test below; declared so it is a known
# cfg rather than an `unexpected_cfgs` warning (this crate has no build.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rootcanal_oracle)'] }

# In-process foreign oracle for tests/rootcanal_oracle_test.rs: a real
# Rootcanal controller as a library, rather than a subprocess on a TCP port.
# The test body is `#![cfg(rootcanal_oracle)]`, so ordinary `cargo test`
# compiles it to nothing:
#
#   RUSTFLAGS="--cfg rootcanal_oracle" cargo test --test rootcanal_oracle_test
#
# A cfg-gated dev-dependency and not a Cargo feature because simble is
# published: optional dev-dependencies are rejected outright, and an optional
# regular path dependency fails `cargo package` ("all dependencies must have a
# version requirement specified"). Dev-dependencies without a version are
# dropped from the published manifest, which is what makes this legal --
# verified, the packaged Cargo.toml names no rootcanal-rs at all.
#
# Caveat, measured: Cargo resolves every target section regardless of active
# cfgs, so ../rootcanal-rs must exist for *any* cargo command here, cfg off
# included. Without it even `cargo metadata` fails. Goes away once
# rootcanal-rs is on crates.io and this becomes a normal optional dependency
# with a semver version.
[target.'cfg(rootcanal_oracle)'.dev-dependencies]
rootcanal-rs = { path = "third_party/rootcanal-rs" }
bytes = "1.4"
