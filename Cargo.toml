[package]
name = "simble"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Zero-Copy Virtual Bluetooth Host Stack & Device Simulation Engine in Rust"
authors = ["Bill Schilit <schilit@google.com>"]
repository = "https://github.com/schilit/simble"
readme = "README.md"
keywords = ["bluetooth", "ble", "gatt", "l2cap", "channel-sounding"]
categories = ["emulators", "network-programming", "embedded"]

# `cdylib` is what wasm-bindgen links the browser module from; `rlib` keeps
# the crate usable as a normal Rust library (examples, tests, downstream).
[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# Used by the in_process_scene example to parse HCI events zero-copy.
zerocopy = { version = "0.8", features = ["derive"] }

[dependencies]
rhai = "1.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: wasm-bindgen-cli's version must match the crate's.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
    "console",
] }
# rhai -> ahash -> getrandom, which on wasm32-unknown-unknown needs the
# browser backend enabled here plus `--cfg getrandom_backend="wasm_js"` in
# RUSTFLAGS at build time (see .github/workflows/pages.yml and README).
getrandom = { version = "0.3", features = ["wasm_js"] }

[[example]]
name = "heart_rate_monitor"
path = "examples/heart_rate_monitor.rs"

[[example]]
name = "ble_keyboard"
path = "examples/ble_keyboard.rs"

[[example]]
name = "channel_sounding"
path = "examples/channel_sounding.rs"

[[example]]
name = "in_process_scene"
path = "examples/in_process_scene.rs"
