# Builds the browser demos (web/) — Simble compiled to wasm32 + wasm-bindgen
# JS glue — and deploys them to GitHub Pages. Requires Pages to be enabled
# with Source: "GitHub Actions" in the repository settings.
name: Deploy web demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # Prebuilt binary download; the version must match the wasm-bindgen
      # crate version pinned in Cargo.toml.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127

      - name: Build Simble for wasm32
        # The getrandom cfg selects its browser backend (see Cargo.toml's
        # wasm32 dependency block).
        run: cargo build --release --target wasm32-unknown-unknown --lib
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"

      - name: Generate the JS bindings
        run: >
          wasm-bindgen --target web --no-typescript --out-dir web/pkg
          target/wasm32-unknown-unknown/release/simble.wasm

      # Crate API documentation, served alongside the demos at /doc/simble/.
      # Warnings are denied so a broken intra-doc link fails the deploy rather
      # than shipping a docs site with dead links.
      - name: Build the crate docs
        run: cargo doc --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Fold the docs into the site
        run: |
          cp -r target/doc web/doc
          # Redirect /doc/ to the crate's own index so the link needn't
          # hardcode the crate name.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./simble/">\n' > web/doc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
