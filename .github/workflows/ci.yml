name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --all-features -- --nocapture

      - name: Run the Testing-page examples through the simble CLI
        # The web Testing page and CI run the *same* .rhai files. Each is named
        # by expectation: *.pass.rhai must exit 0, *.fail.rhai must exit non-zero
        # (a negative test — a failed assertion has to be caught).
        run: |
          cargo build --release --bin simble
          bin=target/release/simble
          rc=0
          # All the passing examples at once — the CLI accepts many files and
          # exits nonzero if any fail.
          "$bin" catalog/tests/*.pass.rhai || { echo "  UNEXPECTED FAIL"; rc=1; }
          for f in catalog/tests/*.fail.rhai; do
            echo "== $f (expect FAIL) =="
            if "$bin" "$f"; then echo "  UNEXPECTED PASS: $f"; rc=1; fi
          done
          exit $rc

      - name: Doc (deny broken links)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Half the product is the browser. Until now the wasm build ran only in
      # pages.yml, which triggers on a push to main -- i.e. AFTER merge -- so a
      # wasm-only regression landed before anything noticed. Two have already
      # cost real time: p256 broke the wasm build outright, and
      # SystemTime::now() panics on wasm32-unknown-unknown. Neither is visible
      # to a native-only matrix.
      #
      # `lc3` is not optional here: without it the bindings carry no WebLc3 and
      # the Media domain fails to start on the deployed site while working
      # locally for anyone who built with the feature. Kept identical to
      # pages.yml on purpose -- if these drift, this gate stops meaning
      # anything.
      - name: Install the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build for wasm32 (the browser surface)
        run: >
          cargo build --release --target wasm32-unknown-unknown --lib
          --features lc3
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"

  sig-assigned-numbers:
    name: SIG assigned-number drift (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking because it depends on a third-party host being reachable,
    # and a network blip must not fail an unrelated PR. The script exits 2 for
    # "could not reach the registry", distinct from 1 for real drift, so the
    # log says which happened.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # src/gatt/sig_names.rs is generated from the Bluetooth SIG's registry.
      # Every test in this repo has simble on both ends, so a wrong constant is
      # invisible to all of them -- the Ranging Service shipped four INVENTED
      # characteristic UUIDs and no in-tree test could have caught it. The SIG
      # registry is the only reference capable of disagreeing with us, and it
      # only helps if something asks. This starts green, so any output is real.
      - name: Diff sig_names.rs against the SIG registry
        run: python3 scripts/check_sig_assigned_numbers.py

  hci-command-answers:
    name: HCI command-answer drift (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking for the same reason as the job above: it fetches from two
    # third-party hosts, and a network blip must not fail an unrelated PR. The
    # script exits 2 for "could not reach a source", distinct from 1 for real
    # drift, so the log says which happened.
    #
    # The half of this check that can run offline is not left to chance: the
    # unit test `test_no_command_status_command_is_ever_answered_with_command
    # _complete` sweeps the same table through the controller on every
    # `cargo test`, and that one blocks. This job is what keeps the *table*
    # honest against the specification.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A controller answers a command with either Command Complete or Command
      # Status, and choosing wrong does not fail -- it hangs the host, with
      # nothing logged anywhere. Five bugs here came from exactly that, all
      # because sim.rs's catch-all answered every unhandled opcode with
      # Command Complete while 61 of Core 6.3's 339 commands are
      # Command-Status-only. Both ends of every test in this repo are simble,
      # so they agree with each other and none of them can notice. This
      # derives the table from the SIG's published Core HTML, cross-checks it
      # against Bumble's Async/Sync command split, and diffs both against
      # sim.rs. It starts green, so any output is real drift.
      - name: Diff sim.rs's command answers against the Core specification
        run: python3 scripts/check_hci_command_answers.py

  bumble-interop:
    name: Bumble interop (foreign oracle)
    runs-on: ubuntu-latest
    # Deliberately NOT continue-on-error. Everything this job needs is
    # installed from PyPI and built from this tree -- there is no third-party
    # host to be flaky, which is the only reason the two jobs above are
    # non-blocking. A gate that cannot fail is not a gate.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These scripts are the only tests in the repo with a *foreign* stack on
      # the other end. Every other test has simble at both ends, so it proves
      # simble agrees with itself -- and this project has twice shipped bytes
      # that every simulated test accepted and a real controller rejected.
      #
      # They used to need `netsimd` from the Android SDK, which is why none of
      # them ran here. They do not actually need netsim: they need a
      # controller and a link, and Bumble ships both (`bumble.controller` +
      # `bumble.link.LocalLink`, the same architecture as simble's `sim.rs` +
      # `Link`). `tests/interop/bumble_link.py` puts a Bumble Device on one
      # controller and publishes a second over `tcp-server:`, which is bare
      # H4 -- exactly what simble's existing `RootcanalTransport` speaks. No
      # new Rust transport was needed for any of this.
      #
      # netsim remains the default and is NOT replaced. rootcanal is a
      # different controller implementation and the difference is load-bearing
      # coverage: it dies on malformed HCI instead of returning an error
      # status, and it honours `Write Inquiry Mode`. The scripts that depend
      # on what only rootcanal models -- `classic_peer.py` (inquiry) and the
      # `auracast_*.py` pair (BIG) -- exit 77 rather than pretend, and stay
      # manual. See `docs/test-strategy.md`.
      - name: Install Bumble
        run: python3 -m pip install --upgrade pip bumble

      - name: Build the examples the scripts drive
        run: >
          cargo build
          --example scripted_central
          --example a2dp_sink
          --example avrcp_remote
          --example hfp_hf_pipe

      - name: Foreign-oracle interop runs (no netsim)
        # A shared runner is slower than a developer machine, and a page that
        # arrives before the peer is page-scanning fails like a protocol bug.
        env:
          SIMBLE_INTEROP_SETTLE: '6'
        run: |
          set -u
          rc=0
          run() {
            echo "== $* =="
            if python3 "$@"; then
              echo "  PASS"
            else
              status=$?
              # 77 is the scripts' "cannot honestly run in this mode" status.
              # Nothing invoked here should skip -- if one starts to, that is
              # a real regression in what this job covers, not an excuse.
              if [ "$status" -eq 77 ]; then
                echo "  UNEXPECTED SKIP (exit 77): this script is supposed to run here"
              else
                echo "  FAIL (exit $status)"
              fi
              rc=1
            fi
          }
          # Needs no controller at all: Bumble's AgProtocol against simble's
          # HF over a pipe. It never needed netsim and was miscategorised.
          run tests/interop/hfp_oracle.py
          run tests/interop/gatt_client.py --transport bumble
          run tests/interop/a2dp_peer.py --transport bumble
          run tests/interop/avrcp_peer.py --transport bumble
          exit $rc

  duplication-report:
    name: Duplication Report (non-blocking)
    runs-on: ubuntu-latest
    # Report-only for now: early-phase churn must not fail CI.
    continue-on-error: true
    env:
      # Don't let the global -D warnings break `cargo install` of third-party tools.
      RUSTFLAGS: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache duplication tools
        id: cache-dup-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-dupes
            ~/.cargo/bin/similarity-rs
          key: dup-tools-${{ runner.os }}-v1

      - name: Install cargo-dupes and similarity-rs
        if: steps.cache-dup-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-dupes
          cargo install similarity-rs

      - name: Duplication report (cargo-dupes)
        run: cargo dupes report --exclude-tests

      - name: Similarity report (similarity-rs)
        run: similarity-rs ./src --skip-test
